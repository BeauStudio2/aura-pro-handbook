<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">From a finding to the next decision</title><desc id="desc">A finding from a test, monitoring, an outcome check or a new observation is accepted only for its supported scope. Each affected person may follow an agreed action, make a fresh choice, return to discovery or owe no further action. Every branch records its reasoning and outcome in project memory.</desc>
<rect width="1000" height="710" fill="#faf8f1"/>
<text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#26392e">From a finding to the next decision</text>
<text x="24" y="66" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#26392e">From a test (7), monitoring (9), outcome check (10), or a new observation.</text>
<rect x="130" y="92" width="740" height="88" rx="8" fill="#e1ece1" stroke="#9faea2" stroke-width="1.3"/>
<text x="150" y="121" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#26392e">What does this finding settle, and for whom?</text>
<text x="150" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#26392e">Name the acceptor, evidence and conditions.</text>
<text x="150" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#26392e">Close answered questions; keep unresolved answers explicit.</text>
<path d="M500,180 L500,210" fill="none" stroke="#26392e" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="500.0,210.0 503.8,202.0 496.2,202.0" fill="#26392e"/>
<rect x="230" y="210" width="540" height="65" rx="8" fill="#e1ece1" stroke="#9faea2" stroke-width="1.3"/>
<text x="250" y="237" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#26392e">Who still needs to act?</text>
<text x="250" y="260" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#26392e">Follow every applicable route; branches can proceed together.</text>
<path d="M500 275V300H134 M500 300H866" fill="none" stroke="#52695e" stroke-width="1.6"/>
<path d="M134,300 L134,326" fill="none" stroke="#52695e" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="134.0,326.0 137.8,318.0 130.2,318.0" fill="#52695e"/>
<path d="M378,300 L378,326" fill="none" stroke="#52695e" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="378.0,326.0 381.8,318.0 374.2,318.0" fill="#52695e"/>
<path d="M622,300 L622,326" fill="none" stroke="#52695e" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="622.0,326.0 625.8,318.0 618.2,318.0" fill="#52695e"/>
<path d="M866,300 L866,326" fill="none" stroke="#52695e" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="866.0,326.0 869.8,318.0 862.2,318.0" fill="#52695e"/>
<rect x="24" y="326" width="220" height="181" rx="8" fill="#fffef9" stroke="#9faea2" stroke-width="1.3"/>
<text x="36" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26392e">Follow an agreed action</text>
<text x="36" y="383" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">The trigger occurred and</text>
<text x="36" y="406" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">the response is authorized.</text>
<text x="36" y="452.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">Assigned person tests (7)</text>
<text x="36" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">or performs work (9).</text>
<text x="36" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">Checker verifies (10).</text>
<path d="M134,507 L134,550" fill="none" stroke="#37677b" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="134.0,550.0 137.8,542.0 130.2,542.0" fill="#37677b"/>
<rect x="268" y="326" width="220" height="181" rx="8" fill="#fffef9" stroke="#9faea2" stroke-width="1.3"/>
<text x="280" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26392e">Make a fresh choice</text>
<text x="280" y="383" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">Tradeoffs are understood.</text>
<text x="280" y="406" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">Owner sets criteria (4),</text>
<text x="280" y="429" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">selects a course (8), or</text>
<text x="280" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">requests a new design (5).</text>
<text x="280" y="475" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">Act within permission.</text>
<path d="M378,507 L378,550" fill="none" stroke="#37677b" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="378.0,550.0 381.8,542.0 374.2,542.0" fill="#37677b"/>
<rect x="512" y="326" width="220" height="181" rx="8" fill="#fffef9" stroke="#9faea2" stroke-width="1.3"/>
<text x="524" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26392e">Return to Discovery (3)</text>
<text x="524" y="383" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">A premise failed or a</text>
<text x="524" y="406" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">material fact is missing.</text>
<text x="524" y="429" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">Name the unknown, who</text>
<text x="524" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">can resolve it, and which</text>
<text x="524" y="475" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">decision needs the answer.</text>
<path d="M622,507 L622,550" fill="none" stroke="#37677b" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="622.0,550.0 625.8,542.0 618.2,542.0" fill="#37677b"/>
<rect x="756" y="326" width="220" height="181" rx="8" fill="#fffef9" stroke="#9faea2" stroke-width="1.3"/>
<text x="768" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26392e">No further action now</text>
<text x="768" y="383" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">Stop the finite work or</text>
<text x="768" y="406" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">resume observation.</text>
<text x="768" y="429" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">If an inquiry stops without</text>
<text x="768" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">an answer, preserve why</text>
<text x="768" y="475" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">and notify affected owners.</text>
<path d="M866,507 L866,550" fill="none" stroke="#37677b" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="866.0,550.0 869.8,542.0 862.2,542.0" fill="#37677b"/>
<rect x="24" y="550" width="952" height="112" rx="8" fill="#edf4f5" stroke="#88a7b2" stroke-width="1.3"/>
<text x="44" y="580" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#37677b">Project memory · every finding and every branch</text>
<text x="44" y="611" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#26392e">Keep sources, scope, acceptance, next actors and reasons as the work proceeds.</text>
<text x="44" y="637" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#26392e">At step 11, review outcomes and lessons; retrieve that history for the next decision.</text>
<text x="24" y="692" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#26392e">This view routes a result. The main map shows where each numbered step belongs.</text>
<text x="36" y="429" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#26392e">Check current readiness.</text></svg>

